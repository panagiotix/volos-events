<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VOLTA — Διαχείριση</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F7F7;--ink:#15222C;--muted:#5A6B76;--gulf:#1D4F7A;--kiln:#C9962E;--line:#D6DEE2;--panel:#FFFFFF;--bad:#B3261E;--good:#2E7D32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1A22;--ink:#E6ECEF;--muted:#93A4AE;--gulf:#7FB0DA;--kiln:#E2B85A;--line:#243542;--panel:#14222C;--bad:#F2B8B5;--good:#A5D6A7}}
:root[data-theme="dark"]{--paper:#0F1A22;--ink:#E6ECEF;--muted:#93A4AE;--gulf:#7FB0DA;--kiln:#E2B85A;--line:#243542;--panel:#14222C;--bad:#F2B8B5;--good:#A5D6A7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Commissioner,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font:400 40px/1.1 "GFS Didot",Georgia,serif;color:var(--gulf);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button,.btn{font:500 14px Commissioner,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.main{background:var(--gulf);border-color:var(--gulf);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--kiln);outline-offset:2px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;background:var(--panel)}
.card.hidden{opacity:.6}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.m{font-size:14px;color:var(--muted);word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.ed label{font-size:12px;color:var(--muted);display:block}
input,select{font:15px Commissioner,sans-serif;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.msg{font-size:14px;margin:8px 0;min-height:1.2em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.login{max-width:420px}
.badge{font:600 11px Commissioner,sans-serif;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--kiln)}
</style>
</head>
<body>
<main>
  <h1>VOLTA · Διαχείριση</h1>
  <p class="sub">Οι αλλαγές εμφανίζονται στη δημόσια σελίδα με την επόμενη ανανέωση (δύο φορές τη μέρα, ή με «Run workflow» στο GitHub).</p>

  <section id="loginBox" class="login" hidden>
    <label for="email">Email διαχειριστή</label>
    <input id="email" type="email" autocomplete="email">
    <div class="row"><button class="btn main" id="sendLink" type="button">Στείλε μου σύνδεσμο σύνδεσης</button></div>
    <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <section id="app" hidden>
    <div class="row" style="justify-content:space-between;margin:0"><span class="m" id="who"></span><button class="btn" id="logout" type="button">Αποσύνδεση</button></div>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-t="subs" aria-selected="true">Υποβολές</button>
      <button type="button" role="tab" data-t="events" aria-selected="false">Εκδηλώσεις</button>
      <button type="button" role="tab" data-t="reports" aria-selected="false">Αναφορές λαθών</button>
      <button type="button" role="tab" data-t="sources" aria-selected="false">Πηγές από υποβολές</button>
    </div>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <div id="list"></div>
  </section>
  <p id="cfgMsg" class="msg err" hidden>Η σελίδα δεν έχει ρυθμίσεις Supabase (SUPABASE_URL / SUPABASE_ANON_KEY στα GitHub Secrets).</p>
</main>
<script>
const SB_URL="__SUPABASE_URL__", SB_ANON="__SUPABASE_ANON__";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KIND={event:"Εκδήλωση",ical:"Ημερολόγιο iCal",rss:"RSS feed",website:"Ιστοσελίδα"};
const CATS=["Θέατρο","Μουσική","Σινεμά","Εκθέσεις","Χορός","Παιδικά","Συνέδρια","Πανεπιστημιακά","Πολιτική","Αθλητισμός","Γαστρονομία","Φεστιβάλ","Βιβλίο","Ομιλίες","Stand-up","Άλλο"];
const fmt=ts=>ts?new Date(ts).toLocaleString("el-GR",{timeZone:"Europe/Athens",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
let sb=null, TAB="subs";
function say(t,cls){ $("msg").textContent=t||""; $("msg").className="msg"+(cls?" "+cls:""); }

async function start(){
  if(!SB_URL.startsWith("https://")||typeof supabase==="undefined"){ $("cfgMsg").hidden=false; return; }
  sb=supabase.createClient(SB_URL,SB_ANON);
  sb.auth.onAuthStateChange(()=>route());
  route();
}
async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("loginBox").hidden=false; $("app").hidden=true; return; }
  const {data:isAdmin}=await sb.rpc("is_admin");
  $("loginBox").hidden=true; $("app").hidden=false;
  $("who").textContent=`Συνδεδεμένος: ${session.user.email}`;
  if(!isAdmin){ $("list").innerHTML=""; say("Ο λογαριασμός δεν είναι διαχειριστής (δεν υπάρχει στον πίνακα admins).","err"); return; }
  render();
}
$("sendLink").onclick=async()=>{
  const email=$("email").value.trim(); if(!email) return;
  $("sendLink").disabled=true;
  const {error}=await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false, emailRedirectTo:location.href.split("#")[0]}});
  $("sendLink").disabled=false;
  $("loginMsg").textContent=error?"Δεν στάλθηκε: "+error.message:"Στάλθηκε σύνδεσμος στο email σου. Άνοιξέ τον από αυτή τη συσκευή.";
  $("loginMsg").className="msg "+(error?"err":"ok");
};
$("logout").onclick=async()=>{ await sb.auth.signOut(); route(); };
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));say("");render();});

async function render(){
  $("list").innerHTML='<p class="m">Φόρτωση…</p>';
  if(TAB==="subs") return renderSubs();
  if(TAB==="events") return renderEvents();
  if(TAB==="reports") return renderReports();
  return renderSources();
}

/* ---------- submissions ---------- */
async function renderSubs(){
  const {data,error}=await sb.from("submissions").select("*").eq("status","pending").order("created_at");
  if(error) return say(error.message,"err");
  if(!data.length){ $("list").innerHTML='<p class="m">Καμία υποβολή σε αναμονή.</p>'; return; }
  $("list").innerHTML=data.map(s=>{const p=s.payload||{};
    const what=s.kind==="event"
      ? `<b>${esc(p.title)}</b><div class="m">${esc(fmt(p.starts_at))}${p.all_day?" (χωρίς ώρα)":""}${p.ends_at?" → "+esc(fmt(p.ends_at)):""} · ${esc(p.venue)} · ${p.region==="pelion"?"Πήλιο":"Βόλος"} · ${esc(p.category)}${p.price?" · "+esc(p.price==="0"?"ελεύθερη είσοδος":p.price):""}</div>`
      : `<b>${esc(p.name)}</b><div class="m"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a> · ${p.region==="pelion"?"Πήλιο":"Βόλος"}${p.date_hint?" · ημερομηνία: "+esc(p.date_hint):""}</div>`;
    return `<div class="card" data-id="${s.id}"><div class="k">${KIND[s.kind]||s.kind} · ${esc(fmt(s.created_at))}</div>${what}
      <div class="m">${p.organizer?"Διοργανωτής: "+esc(p.organizer)+" · ":""}${s.contact_email?"Email: "+esc(s.contact_email):"χωρίς email"}${p.url&&s.kind==="event"?` · <a href="${esc(p.url)}" target="_blank" rel="noopener">σύνδεσμος</a>`:""}${p.description||p.note?"<br>Σημείωση: "+esc(p.description||p.note):""}</div>
      <div class="row"><button class="btn main" data-a="ok">Έγκριση</button><input data-f="reason" placeholder="Αιτία απόρριψης (προαιρετικά)" style="flex:1 1 220px;width:auto"><button class="btn danger" data-a="no">Απόρριψη</button></div></div>`;}).join("");
  $("list").querySelectorAll(".card").forEach(c=>c.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    const id=+c.dataset.id; c.querySelectorAll("button").forEach(x=>x.disabled=true);
    const {error}= b.dataset.a==="ok"
      ? await sb.rpc("approve_submission",{sub_id:id})
      : await sb.from("submissions").update({status:"rejected",reason:c.querySelector('[data-f="reason"]').value.trim()||null}).eq("id",id);
    if(error){ say(error.message,"err"); c.querySelectorAll("button").forEach(x=>x.disabled=false); return; }
    say(b.dataset.a==="ok"?"Εγκρίθηκε.":"Απορρίφθηκε.","ok"); renderSubs();
  }));
}

/* ---------- events: correct every field, or remove from the page ---------- */
// local Athens date/time ⇄ UTC ISO, using the browser's time-zone data
function athensParts(ts){
  const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Athens",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
    .formatToParts(new Date(ts)).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour}:${p.minute}`};
}
function athensIso(day, hhmm){
  const [y,m,d]=day.split("-").map(Number), [H,M]=(hhmm||"00:00").split(":").map(Number);
  const asUtc=Date.UTC(y,m-1,d,H,M), p=athensParts(asUtc);
  const shown=Date.UTC(+p.date.slice(0,4),+p.date.slice(5,7)-1,+p.date.slice(8,10),+p.time.slice(0,2),+p.time.slice(3,5));
  const off=Math.round((shown-asUtc)/36e5);
  return `${day}T${String(H).padStart(2,"0")}:${String(M).padStart(2,"0")}:00+${String(off).padStart(2,"0")}:00`;
}
// what the page currently shows for a field = override if present, else the collected value
function eff(e){
  const o=e.overrides||{};
  const st=o.starts_at??e.starts_at, en=o.ends_at!==undefined?o.ends_at:e.ends_at;
  const s=athensParts(st);
  return { title:o.title??e.title, date:s.date, time:(o.all_day??e.all_day)?"":s.time,
    end:en?athensParts(en).date:"", venue:o.venue??e.venue??"", region:o.region??e.region??"volos",
    category:o.category??e.category??"Άλλο", price:o.price??e.price??"", url:o.url??e.url??"", description:o.description??e.description??"" };
}
// compare the form with the COLLECTED values: only real differences become overrides,
// so every untouched field keeps following the source
function diffOverrides(e,f){
  const orig=eff({...e,overrides:{}}), o={};
  for(const k of ["title","venue","region","category","price","url","description"]) if(f[k]!==String(orig[k]??"")) o[k]=f[k];
  if(f.date!==orig.date||f.time!==orig.time){ o.starts_at=athensIso(f.date,f.time||"00:00"); o.all_day=!f.time; }
  if(f.end!==orig.end) o.ends_at=f.end?athensIso(f.end,"23:59"):null;
  return o;
}
let EV_FILTER="published", EV_PREFILL="";
async function renderEvents(){
  const since=new Date(Date.now()-864e5).toISOString();
  const {data,error}=await sb.from("events").select("id,external_id,title,description,starts_at,ends_at,all_day,venue,region,category,price,url,status,overrides,sources")
    .or(`starts_at.gte.${since},ends_at.gte.${since}`).order("starts_at").limit(500);
  if(error) return say(error.message,"err");
  $("list").innerHTML=`<details class="card" id="newEv"><summary style="cursor:pointer;font-weight:600">＋ Νέα εκδήλωση (δημοσιεύεται απευθείας)</summary>
      <div class="ed">
        <div style="grid-column:1/-1"><label>Τίτλος *</label><input data-n="title"></div>
        <div><label>Ημερομηνία *</label><input data-n="date" type="date"></div>
        <div><label>Ώρα (κενό = χωρίς ώρα)</label><input data-n="time" type="time"></div>
        <div><label>Έως (πολυήμερη)</label><input data-n="end" type="date"></div>
        <div><label>Χώρος *</label><input data-n="venue"></div>
        <div><label>Περιοχή</label><select data-n="region"><option value="volos">Βόλος</option><option value="pelion">Πήλιο</option></select></div>
        <div><label>Κατηγορία</label><select data-n="category">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div><label>Τιμή (0 = ελεύθερη)</label><input data-n="price"></div>
        <div style="grid-column:1/-1"><label>Σύνδεσμος</label><input data-n="url" type="url" placeholder="https://"></div>
        <div style="grid-column:1/-1"><label>Περιγραφή (προαιρετική)</label><input data-n="description"></div>
      </div>
      <div class="row"><button class="btn main" id="addEv" type="button">Δημοσίευση</button></div></details>
    <div class="row" style="margin:0 0 6px">
      <input id="q" placeholder="Αναζήτηση τίτλου ή χώρου" style="max-width:320px">
      <select id="vis" style="max-width:220px"><option value="published">Στη σελίδα</option><option value="hidden">Αφαιρεμένες</option><option value="all">Όλες</option></select>
      <span class="m" id="cnt"></span></div><div id="evs"></div>`;
  $("vis").value=EV_FILTER; $("q").value=EV_PREFILL; EV_PREFILL="";
  const draw=()=>{
    const q=$("q").value.toLowerCase();
    const rows=data.filter(e=>(EV_FILTER==="all"||e.status===EV_FILTER) && (!q||(e.title+" "+(e.venue||"")+" "+JSON.stringify(e.overrides||{})).toLowerCase().includes(q)));
    $("cnt").textContent=`${rows.length} εκδηλώσεις`;
    $("evs").innerHTML=rows.map(e=>{const v=eff(e), changed=Object.keys(e.overrides||{}).length>0;
      return `<div class="card ${e.status==="hidden"?"hidden":""}" data-id="${e.id}">
        <div class="k">${(e.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a>`).join(", ")||"—"}${String(e.external_id||"").startsWith("admin-")?'<span class="badge">δική σου</span>':""}${e.status==="hidden"?'<span class="badge">αφαιρεμένη</span>':""}${changed?'<span class="badge">διορθωμένη</span>':""}</div>
        <div class="ed">
          <div style="grid-column:1/-1"><label>Τίτλος</label><input data-f="title" value="${esc(v.title)}"></div>
          <div><label>Ημερομηνία</label><input data-f="date" type="date" value="${esc(v.date)}"></div>
          <div><label>Ώρα (κενό = χωρίς ώρα)</label><input data-f="time" type="time" value="${esc(v.time)}"></div>
          <div><label>Έως (πολυήμερη)</label><input data-f="end" type="date" value="${esc(v.end)}"></div>
          <div><label>Χώρος</label><input data-f="venue" value="${esc(v.venue)}"></div>
          <div><label>Περιοχή</label><select data-f="region"><option value="volos" ${v.region==="volos"?"selected":""}>Βόλος</option><option value="pelion" ${v.region==="pelion"?"selected":""}>Πήλιο</option></select></div>
          <div><label>Κατηγορία</label><select data-f="category">${[...new Set([...CATS,v.category])].map(c=>`<option ${c===v.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
          <div><label>Τιμή (0 = ελεύθερη)</label><input data-f="price" value="${esc(v.price)}"></div>
          <div style="grid-column:1/-1"><label>Σύνδεσμος</label><input data-f="url" type="url" value="${esc(v.url)}"></div>
          <div style="grid-column:1/-1"><label>Περιγραφή (προαιρετική)</label><input data-f="description" value="${esc(v.description)}"></div>
        </div>
        <div class="row"><button class="btn main" data-a="save">Αποθήκευση</button>
          ${changed?'<button class="btn" data-a="reset">Επαναφορά αρχικών στοιχείων</button>':""}
          <button class="btn ${e.status==="hidden"?"":"danger"}" data-a="toggle">${e.status==="hidden"?"Επαναφορά στη σελίδα":"Αφαίρεση από τη σελίδα"}</button>
          ${String(e.external_id||"").startsWith("admin-")?'<button class="btn danger" data-a="delete">Οριστική διαγραφή</button>':""}</div></div>`;}).join("")||'<p class="m">Τίποτα.</p>';
    $("evs").querySelectorAll(".card").forEach(c=>c.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      const id=+c.dataset.id, e=data.find(x=>x.id===id); let upd;
      if(b.dataset.a==="delete"){
        if(!confirm("Οριστική διαγραφή αυτής της εκδήλωσης;")) return;
        const {error}=await sb.from("events").delete().eq("id",id);
        if(error) return say(error.message,"err");
        data.splice(data.indexOf(e),1); say("Διαγράφηκε.","ok"); return draw();
      }
      if(b.dataset.a==="toggle") upd={status:e.status==="hidden"?"published":"hidden"};
      else if(b.dataset.a==="reset") upd={overrides:{}};
      else {
        const f={}; c.querySelectorAll("[data-f]").forEach(i=>f[i.dataset.f]=i.value.trim());
        if(!f.title||!f.date) return say("Ο τίτλος και η ημερομηνία δεν μπορούν να είναι κενά.","err");
        if(f.end&&f.end<f.date) return say("Η λήξη είναι πριν από την ημερομηνία.","err");
        upd={overrides:diffOverrides(e,f)};
      }
      b.disabled=true;
      const {error}=await sb.from("events").update(upd).eq("id",id);
      b.disabled=false;
      if(error) return say(error.message,"err");
      Object.assign(e,upd);
      say(b.dataset.a==="toggle"?(e.status==="hidden"?"Αφαιρέθηκε από τη σελίδα.":"Επανήλθε στη σελίδα."):"Αποθηκεύτηκε.","ok"); draw();
    }));
  };
  $("addEv").onclick=async()=>{
    const f={}; document.querySelectorAll("#newEv [data-n]").forEach(i=>f[i.dataset.n]=i.value.trim());
    if(!f.title||!f.date||!f.venue) return say("Συμπλήρωσε τίτλο, ημερομηνία και χώρο.","err");
    if(f.end&&f.end<f.date) return say("Η λήξη είναι πριν από την ημερομηνία.","err");
    if(f.url&&!/^https?:\/\//.test(f.url)) return say("Ο σύνδεσμος πρέπει να ξεκινά με https://","err");
    const row={source_id:null, external_id:"admin-"+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),
      title:f.title, starts_at:athensIso(f.date,f.time||"00:00"), all_day:!f.time, ends_at:f.end?athensIso(f.end,"23:59"):null,
      venue:f.venue, region:f.region, category:f.category, price:f.price||null, url:f.url||null, description:f.description||null,
      status:"published", sources:[{source:"VOLTA",url:f.url||"#"}]};
    $("addEv").disabled=true;
    const {data:ins,error}=await sb.from("events").insert(row).select().single();
    $("addEv").disabled=false;
    if(error) return say(error.message,"err");
    data.push(ins); data.sort((a,b)=>a.starts_at.localeCompare(b.starts_at));
    document.querySelectorAll("#newEv [data-n]").forEach(i=>{ if(i.tagName==="INPUT") i.value=""; });
    $("newEv").open=false; say("Δημοσιεύτηκε. Θα εμφανιστεί στη σελίδα με την επόμενη ανανέωση.","ok"); draw();
  };
  $("q").oninput=draw; $("vis").onchange=()=>{EV_FILTER=$("vis").value;draw();}; draw();
}

/* ---------- reports from visitors ---------- */
const ISSUE={date:"Ημερομηνία ή ώρα",venue:"Χώρος",cancelled:"Ακυρώθηκε / αναβλήθηκε",duplicate:"Διπλή εμφάνιση",irrelevant:"Άσχετη",other:"Άλλο"};
function goTab(t){ TAB=t; document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.t===t))); render(); }
async function renderReports(){
  const {data,error}=await sb.from("reports").select("*").eq("status","open").order("created_at");
  if(error) return say(error.message,"err");
  $("list").innerHTML=data.length?data.map(r=>`<div class="card" data-id="${r.id}">
      <div class="k">${esc(ISSUE[r.issue]||r.issue)} · ${esc(fmt(r.created_at))}</div>
      <b>${esc(r.event_title||"(χωρίς τίτλο)")}</b><div class="m">${esc(r.event_date||"")}${r.event_url?` · <a href="${esc(r.event_url)}" target="_blank" rel="noopener">πηγή</a>`:""}${r.contact_email?" · "+esc(r.contact_email):""}</div>
      ${r.message?`<p style="margin:8px 0 0">${esc(r.message)}</p>`:""}
      <div class="row"><button class="btn main" data-a="open">Άνοιγμα της εκδήλωσης για διόρθωση</button>
        <button class="btn" data-a="resolved">Λύθηκε</button><button class="btn danger" data-a="dismissed">Απόρριψη</button></div></div>`).join("")
    :'<p class="m">Καμία ανοιχτή αναφορά.</p>';
  $("list").querySelectorAll(".card").forEach(c=>c.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    const r=data.find(x=>x.id===+c.dataset.id);
    if(b.dataset.a==="open"){ EV_FILTER="all"; EV_PREFILL=(r.event_title||"").slice(0,40); goTab("events"); return; }
    const {error}=await sb.from("reports").update({status:b.dataset.a}).eq("id",r.id);
    if(error) return say(error.message,"err");
    say(b.dataset.a==="resolved"?"Σημειώθηκε ως λυμένη.":"Απορρίφθηκε.","ok"); renderReports();
  }));
}

/* ---------- approved feeds ---------- */
async function renderSources(){
  const {data,error}=await sb.from("sources").select("*").in("kind",["ical","rss","html"]).order("created_at",{ascending:false});
  if(error) return say(error.message,"err");
  $("list").innerHTML=data.length?data.map(s=>`<div class="card ${s.active?"":"hidden"}" data-id="${s.id}"><div class="k">${esc(s.kind)} · ${s.region==="pelion"?"Πήλιο":"Βόλος"}${s.kind==="html"?' · <span class="badge">θέλει parser</span>':""}</div><b>${esc(s.name)}</b><div class="m"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>
    <div class="row"><button class="btn ${s.active?"danger":""}" data-a="toggle">${s.active?"Απενεργοποίηση":"Ενεργοποίηση"}</button></div></div>`).join(""):'<p class="m">Δεν υπάρχουν εγκεκριμένα feeds ακόμη.</p>';
  $("list").querySelectorAll(".card").forEach(c=>c.querySelector("button").onclick=async()=>{
    const id=+c.dataset.id, s=data.find(x=>x.id===id);
    const {error}=await sb.from("sources").update({active:!s.active}).eq("id",id);
    if(error) return say(error.message,"err"); renderSources();
  });
}
start();
</script>
