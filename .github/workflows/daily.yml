name: Καθημερινή ενημέρωση

on:
  schedule:
    - cron: "0 4,16 * * *"   # 04:00 & 16:00 UTC = 07:00 & 19:00 θερινή ώρα Ελλάδας (06:00 & 18:00 χειμερινή)
  workflow_dispatch:          # κουμπί «Run workflow» για χειροκίνητη εκτέλεση

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ελληνικό λεξικό (για τόνους σε τίτλους με κεφαλαία)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hunspell-el || true

      - name: Λήψη σελίδων
        run: python fetch.py

      - name: Συλλογή και δημιουργία σελίδας
        env:
          LIVE: "1"
          TZ: Europe/Athens
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}           # public: goes into the page (form)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}     # secret: pipeline only, never in the page
        run: python build_site.py

      - name: Log στη σύνοψη της εκτέλεσης
        if: always()
        run: |
          { echo '### Λήψεις'; echo '```'; cat live/_fetch.log; echo '```'; cat log.md; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
