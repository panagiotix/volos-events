name: Ενημέρωση (00:07, 10:07, 16:07 ώρα Ελλάδας)

# GitHub schedules run in UTC and do not follow daylight saving time.
# Two schedules, one per season; the "gate" job lets only the one that matches
# the current Greek time run, so the site updates at 00:07, 10:07 and 16:07
# Greek time all year round (minute :07 avoids the busy top of the hour).
on:
  schedule:
    - cron: "7 21,7,13 * * *"    # θερινή ώρα (UTC+3): 00:07, 10:07, 16:07
    - cron: "7 22,8,14 * * *"    # χειμερινή ώρα (UTC+2): 00:07, 10:07, 16:07
  workflow_dispatch:              # κουμπί «Run workflow»
  push:
    branches: [main]              # κάθε git push ανανεώνει τη σελίδα

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          OFFSET=$(TZ=Europe/Athens date +%z)            # +0300 θερινή, +0200 χειμερινή
          if   [ "$OFFSET" = "+0300" ] && [ "$SCHEDULE" = "7 21,7,13 * * *" ]; then RUN=true
          elif [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "7 22,8,14 * * *" ]; then RUN=true
          else RUN=false; fi
          echo "Ώρα Ελλάδας: $(TZ=Europe/Athens date '+%H:%M %z') · πρόγραμμα: $SCHEDULE · εκτέλεση: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ελληνικό λεξικό (για τόνους σε τίτλους με κεφαλαία)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hunspell-el || true

      - name: Λήψη σελίδων
        run: python fetch.py

      - name: Συλλογή και δημιουργία σελίδας
        env:
          LIVE: "1"
          TZ: Europe/Athens
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}           # public: goes into the page (form)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}     # secret: pipeline only, never in the page
        run: python build_site.py

      - name: Log στη σύνοψη της εκτέλεσης
        if: always()
        run: |
          { echo '### Λήψεις'; echo '```'; cat live/_fetch.log; echo '```'; cat log.md; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
